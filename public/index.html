/* ================================================================= router -- */
let clockTimer = null, runStartTs = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }
function requireUser(){ if(!S.user){ go("#/login"); return false; } return true; }

function parseHash(){
  const raw = (location.hash || "#/").replace(/^#/,"");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  new URLSearchParams(qs||"").forEach((v,k)=>params[k]=v);
  return { parts, params, path:"/"+parts.join("/") };
}

function render(){
  if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
  const { parts, params } = parseHash();
  const app = $("#app");
  const root = parts[0] || "";

  // --- public routes
  if(!root){ app.innerHTML = renderLanding(); afterRender(); return; }
  if(root === "login"){ app.innerHTML = renderAuth("login"); afterRender(); return; }
  if(root === "signup"){ app.innerHTML = renderAuth("signup"); afterRender(); return; }
  if(root === "onboarding"){ if(!requireUser()) return; app.innerHTML = renderOnboarding(); afterRender(); return; }

  if(!requireUser()) return;

  switch(root){
    case "dashboard": app.innerHTML = renderDashboard(); break;
    case "courses":   app.innerHTML = renderCourses(); break;
    case "course":    app.innerHTML = renderCourse(parts[1]); break;
    case "upload":    app.innerHTML = renderUpload(); afterRender(); return;
    case "quizzes":   app.innerHTML = renderQuizzes(); break;
    case "quiz":
      if(parts[1] === "new"){ app.innerHTML = renderQuizConfig({ courseId:params.course, chapter:params.chapter }); }
      else if(parts[1] === "run"){ startClock(); app.innerHTML = renderQuizRun(parts[2]); afterRender(); return; }
      else app.innerHTML = renderQuizzes();
      break;
    case "results":   app.innerHTML = renderResults(parts[1]); break;
    case "mistakes":  app.innerHTML = renderMistakes(); break;
    case "notes":     app.innerHTML = renderNotes(); break;
    case "progress":  app.innerHTML = renderProgress(); break;
    case "settings":  app.innerHTML = renderSettings(); break;
    default: app.innerHTML = renderLanding(); afterRender(); return;
  }
  afterRender();
}

function startClock(){
  runStartTs = runStartTs || Date.now();
  clockTimer = setInterval(()=>{
    const el = document.getElementById("run-clock");
    if(!el) return;
    const s = Math.floor((Date.now()-runStartTs)/1000);
    el.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  }, 1000);
  runStartTs = Date.now();
}

function afterRender(){
  applyTheme();
  paintAiStatus();
  if(!/^#\/(how|features|levels|demo)$/.test(location.hash)) window.scrollTo(0,0);
}

function analyseFlow(source){
  const u = UploadState;
  u.status = "analysing"; u.step = 0; u.progress = 0; u.error = null;
  render();
  const stepTimer = setInterval(()=>{ if(u.step < 3){ u.step++; render(); } }, 620);
  const progTimer = setInterval(()=>{ u.progress = Math.min(94, u.progress + 6 + Math.random()*9); const f = document.querySelector("#up-fill"); if(f) f.style.width = u.progress+"%"; }, 220);

  const work = (async () => {
    let text = "", pages = 1, lowConfidence = false, name = "", size = 0;
    if(source.file){
      name = source.file.name; size = source.file.size;
      if(/\.pdf$/i.test(name) || source.file.type === "application/pdf"){
        const r = await extractPdfText(source.file, (i,n)=>{ u.progress = Math.max(u.progress, (i/n)*80); });
        text = r.text; pages = r.pages; lowConfidence = r.lowConfidence;
      } else {
        text = await source.file.text();
        pages = Math.max(1, Math.round(text.length/1800));
      }
    } else { text = source.text; name = source.name || "Texte collé"; pages = Math.max(1, Math.round(text.length/1800)); }

    // 1. Real AI, server-side, when the backend has a key.
    const remote = await withBusy(t("up.analyzing"), t("qc.working.sub"), () =>
      AI.analyse(text, { pages, fileName:name, size, lowConfidence, author:name }));

    // The model can legitimately conclude the document is too thin. Trust it
    // instead of silently falling back and inventing questions from noise.
    if(remote && remote.error === "not-enough-content") throw new Error("not-enough-content");

    let course = (remote && remote.course) || null;

    // 2. On-device engine: no key, offline, rate limited or the call failed.
    if(!course){
      course = Engine.analyseText(text, { pages, fileName:name, size, lowConfidence, author:name });
      course.ai = "local";
      const structured = (course._stats && course._stats.structured) || 0;
      if((course._stats && course._stats.concepts || 0) < 3 || (structured < 2 && (course._stats && course._stats.concepts || 0) < 8))
        throw new Error("not-enough-content");
    }

    const concepts = sum(course.chapters.map(c=>c.concepts.length));
    // Too little identifiable material: never invent a course out of noise.
    if(concepts < 3) throw new Error("not-enough-content");
    return { course, concepts };
  })();

  work.then(({course, concepts}) => {
    clearInterval(stepTimer); clearInterval(progTimer);
    u.step = 4; u.progress = 100; render();
    return wait(420).then(()=>{
      Actions.addCourse(course);
      UploadState.file = null; UploadState.status = "idle"; UploadState.text = "";
      UI.toast(t("toast.courseAdded"));
      go("#/course/" + course.id);
      if(concepts < 6) setTimeout(()=>{
        UI.toast(t("an.lowconf"), "warn");
      }, 700);
    });
  }).catch(err => {
    clearInterval(stepTimer); clearInterval(progTimer);
    UploadState.status = "failed";
    UploadState.errorCode = (err && err.message) || "unknown";
    UploadState.error = UploadState.errorCode === "not-enough-content"
      ? t("an.noconcepts")
      : (UploadState.errorCode === "no-text-layer" ? "PDF sans couche texte" : UploadState.errorCode);
    render();
  });
}

const ON_CHANGE = (el) => {
  // language selectors
  if(el.id === "land-lang" || el.id === "auth-lang" || el.id === "o-lang" || el.id === "s-lang"){
    setLang(el.value); if(S.user){ Actions.setUser({ uiLang: el.value }); } render(); return;
  }
  if(el.id === "cfg-course"){ QuizCfg.courseId = el.value; QuizCfg.scope = {kind:"whole", id:null}; render(); return; }
  if(el.id === "cfg-chapter"){ QuizCfg.scope = {kind:"chapter", id:el.value || null}; if(!el.value) QuizCfg.scope={kind:"whole",id:null}; render(); return; }
  if(el.id === "cfg-topic"){ QuizCfg.scope = {kind:"topic", id:el.value || null}; if(!el.value) QuizCfg.scope={kind:"whole",id:null}; return; }
  if(el.id === "cfg-lang"){ QuizCfg.lang = el.value; return; }
  if(el.id === "note-course"){ NoteFilter.courseId = el.value || null; render(); return; }
  if(el.id === "note-search"){ NoteFilter.q = el.value; return; }

  if(el.id === "s-quizlang"){ Actions.setUser({ quizLang: el.value }); return; }
  if(el.id === "nm-course"){ return; }
};

function filterCourses(q){
  const n = norm(q);
  const grid = document.getElementById("course-grid");
  if(!grid) return;
  const cards = Array.from(grid.children);
  let visible = 0;
  cards.forEach((card, i) => {
    const c = S.courses[i]; if(!c) return;
    const hit = !n || norm(c.title + " " + c.subject + " " + (c.keywords||[]).join(" ")).includes(n);
    card.style.display = hit ? "" : "none";
    if(hit) visible++;
  });
  let note = document.getElementById("course-noresult");
  if(!visible){
    if(!note){ note = document.createElement("p"); note.id = "course-noresult"; note.className = "muted small mt20"; note.textContent = t("notes.noresult"); grid.after(note); }
  } else if(note) note.remove();
}

function selectFile(file){
  if(!/\.(pdf|txt|md)$/i.test(file.name) && !["application/pdf","text/plain"].includes(file.type)){
    UI.toast(t("up.type"), "warn"); return;
  }
  if(file.size > MAX_SIZE){ UI.toast(t("up.size"), "warn"); return; }
  UploadState.file = file; UploadState.status = "selected"; UploadState.error = null;
  if(/\.pdf$/i.test(file.name)) buildPdfPreview(file);
  render();
}
function buildPdfPreview(file){
  loadPdfJs().then(pdfjs => {
    const fr = new FileReader();
    fr.onload = () => pdfjs.getDocument({ data: new Uint8Array(fr.result) }).promise.then(doc => doc.getPage(1)).then(page => {
      const viewport = page.getViewport({ scale: .55 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      return page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise.then(() => {
        UploadState.previewUrl = canvas.toDataURL("image/jpeg", .7);
        if(UploadState.status === "selected") render();
      });
    }).catch(()=>{});
    fr.readAsArrayBuffer(file);
  }).catch(()=>{});
}

function retryQuestion(qId, courseId){
  let src = null;
  for(const z of S.quizzes){ src = z.questions.find(q=>q.id===qId); if(src) break; }
  if(!src){ const m = S.mistakes.find(x=>x.qId===qId); if(m) src = m.snapshot; }
  if(!src) return;
  const quiz = { id:uid("z"), courseId:courseId||null, createdAt:Date.now(),
    config:{ count:1, difficulty:src.difficulty||"mixed", type:src.type||"mcq", scope:{kind:"topic", id:src.concept}, weak:true, lang:src.lang||L() },
    questions:[{...src, id:uid("q"), n:1}] };
  Actions.addQuiz(quiz);
  Run.quiz = null; runStartTs = 0;
  go("#/quiz/run/" + quiz.id);
}

function practiceMistakes(){
  const open = S.mistakes.filter(m=>!m.mastered);
  if(!open.length) return;
  const by = {};
  open.forEach(m => { (by[m.courseId] = by[m.courseId]||[]).push(m); });
  const cid = Object.entries(by).sort((a,b)=>b[1].length-a[1].length)[0][0];
  const course = Actions.course(cid);
  const makeFromSnapshots = (items) => {
    const qs = items.slice(0,20).map((m,i) => ({ ...(m.snapshot||{}), id:uid("q"), n:i+1 }));
    if(!qs.length) return null;
    const quiz = { id:uid("z"), courseId:cid, createdAt:Date.now(),
      config:{ count:qs.length, difficulty:"mixed", type:"mixed", scope:{kind:"topic", id:t("mis.title")}, weak:true }, questions:qs };
    Actions.addQuiz(quiz); return quiz;
  };
  if(!course){ const q = makeFromSnapshots(by[cid]); if(q){ Run.quiz=null; runStartTs=0; go("#/quiz/run/"+q.id); } return; }
  const names = new Set(by[cid].map(m => norm(m.concept || (m.snapshot&&m.snapshot.concept) || "")));
  const filtered = { ...course, chapters: course.chapters.map(ch => ({...ch, concepts: ch.concepts.filter(k=>names.has(norm(k.term)))}))
                                     .filter(ch => ch.concepts.length) };
  let quiz = null;
  if(filtered.chapters.length){
    const res = Engine.buildQuiz(filtered, { count: clamp(by[cid].length*2, 5, 20), difficulty:"mixed", type:"mixed", scope:{kind:"whole"}, weak:true });
    if(!res.error) quiz = { id:uid("z"), courseId:cid, createdAt:Date.now(),
      config:{ count:res.questions.length, difficulty:"mixed", type:"mixed", scope:{kind:"whole"}, weak:true }, questions:res.questions, partial:res.partial };
  }
  if(!quiz) quiz = makeFromSnapshots(by[cid]);
  if(!quiz) return;
  Actions.addQuiz(quiz);
  Run.quiz = null; runStartTs = 0;
  go("#/quiz/run/" + quiz.id);
}

/* ---- global click delegation ---- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-demo],[data-google],[data-level],[data-section],[data-onb-skip],[data-del-course],[data-weak-quiz],[data-remove-file],[data-analyse],[data-cancel-analysis],[data-reset-upload],[data-paste-analyse],[data-count],[data-diff],[data-type],[data-scope],[data-weak-toggle],[data-generate],[data-opt],[data-prev],[data-next],[data-skip],[data-goto],[data-finish],[data-exit],[data-short-ok],[data-note-q],[data-retry-q],[data-mfilter],[data-practice-mistakes],[data-mastered],[data-remove-mistake],[data-note-new],[data-note-edit],[data-note-del],[data-note-pin],[data-theme],[data-export],[data-reset],[data-logout],[data-modal-x]");
  if(!el) return;
  const d = el.dataset;

  if(d.demo !== undefined && el.hasAttribute("data-demo")){
    seedDemo(!S.user); setLang(S.ui.lang); go("#/dashboard"); return;
  }
  if(el.hasAttribute("data-google")){
    S.user = { name:"Étudiant", email:"etudiant@gmail.com", level:"bac", section:"Informatique", spec:"", uiLang:L(), quizLang:"auto", provider:"google" };
    Store.save(S); go("#/onboarding"); return;
  }
  if(d.level !== undefined){
    const u = Actions.ensureUser(); u.level = d.level; Store.save(S);
    document.querySelectorAll("[data-level]").forEach(b=>b.classList.toggle("on", b.dataset.level===d.level));
    const sec = document.querySelector("[data-sec-wrap]"), spec = document.querySelector("[data-spec-wrap]");
    if(sec) sec.style.display = d.level==="prepa" ? "none" : "";
    if(spec) spec.style.display = d.level==="prepa" ? "" : "none";
    return;
  }
  if(d.section !== undefined){
    const u = Actions.ensureUser(); u.section = d.section; Store.save(S);
    document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("on", b.dataset.section===d.section));
    return;
  }
  if(el.hasAttribute("data-onb-skip")){ go("#/dashboard"); return; }
  if(d.delCourse){
    const c = Actions.course(d.delCourse);
    UI.confirm({ title:t("courses.delete"), body:(c?c.title:"") + " — " + t("courses.confirmdel"), onConfirm(){
      Actions.deleteCourse(d.delCourse); UI.toast(t("courses.delete")); go("#/courses");
    }});
    return;
  }
  if(d.weakQuiz){ QuizCfg.courseId = d.weakQuiz; QuizCfg.weak = true; QuizCfg.scope = {kind:"whole", id:null}; go("#/quiz/new?course="+d.weakQuiz); return; }
  if(d.removeFile!==undefined && el.hasAttribute("data-remove-file")){ UploadState.file=null; UploadState.previewUrl=null; UploadState.status="idle"; render(); return; }
  if(el.hasAttribute("data-analyse")){
    if(UploadState.file) analyseFlow({ file:UploadState.file });
    return;
  }
  if(el.hasAttribute("data-cancel-analysis")){ UploadState.status = UploadState.file ? "selected" : "idle"; render(); return; }
  if(el.hasAttribute("data-reset-upload")){
    UploadState.status="idle"; UploadState.error=null; UploadState.errorCode=null; UploadState.file=null;
    const wantPaste = el.hasAttribute("data-focus-paste");
    render();
    if(wantPaste) setTimeout(()=>{ const ta = document.getElementById("paste-text"); if(ta) ta.focus(); }, 60);
    return;
  }
  if(el.hasAttribute("data-paste-analyse")){
    const txt = ($("#paste-text")||{}).value || "";
    if(txt.trim().length < PASTE_MIN){ UI.toast(t("up.paste.min", { n: PASTE_MIN - txt.trim().length }), "warn"); return; }
    analyseFlow({ text:txt, name:"Note de cours" });
    return;
  }

  // quiz config
  if(e.target.closest("#drop") && !e.target.closest("label") && !e.target.closest("button")){
    const fi = document.getElementById("file-input"); if(fi) fi.click(); return;
  }
  if(d.count){ QuizCfg.count = +d.count; render(); return; }
  if(d.diff){ QuizCfg.difficulty = d.diff; render(); return; }
  if(d.type){ QuizCfg.type = d.type; render(); return; }
  if(d.scope){ QuizCfg.scope = { kind:d.scope, id:null }; render(); return; }
  if(el.hasAttribute("data-weak-toggle")){
    const has = Stats.openMistakes().filter(m=>m.courseId===QuizCfg.courseId).length;
    if(!has){ UI.toast(t("qc.weak.none"), "warn"); return; }
    QuizCfg.weak = !QuizCfg.weak; render(); return;
  }
  if(el.hasAttribute("data-generate")){ generateQuiz().catch(()=>UI.toast(t("up.failed.t"), "warn")); return; }

  // quiz run
  if(d.opt !== undefined){
    Run.answers[Run.index] = +d.opt; Run.dir = "same";
    const q = Actions.quiz(Run.quiz).questions[Run.index];
    document.querySelectorAll("[data-opt]").forEach(b => {
      const i = +b.dataset.opt; b.classList.toggle("sel", i === +d.opt);
      b.setAttribute("aria-checked", i === +d.opt);
      const tag = b.querySelector(".tag"); if(tag) tag.remove();
    });
    const btn = document.querySelector(`[data-opt="${d.opt}"]`);
    if(btn && !btn.querySelector(".tag")) btn.insertAdjacentHTML("beforeend",
      `<span class="tag" style="color:var(--accent-ink)">${icon("check",15)}${esc(t("q.selected"))}</span>`);
    paintDots(); return;
  }
  if(el.hasAttribute("data-prev")){ Run.dir="prev"; Run.index = Math.max(0, Run.index-1); render(); return; }
  if(el.hasAttribute("data-next")){ Run.dir="next"; Run.index = Math.min(Actions.quiz(Run.quiz).questions.length-1, Run.index+1); render(); return; }
  if(el.hasAttribute("data-skip")){ delete Run.answers[Run.index]; Run.dir="next"; Run.index = Math.min(Actions.quiz(Run.quiz).questions.length-1, Run.index+1); render(); return; }
  if(d.goto !== undefined){ Run.dir = +d.goto > Run.index ? "next" : "prev"; Run.index = +d.goto; render(); return; }
  if(el.hasAttribute("data-finish")){ finishQuiz(false).catch(()=>{}); return; }
  if(el.hasAttribute("data-exit")){
    UI.confirm({ title:t("q.confirm.t"), body:t("q.confirm.d"), confirmLabel:t("q.confirm.yes"), danger:false,
      onConfirm(){ Run.quiz=null; go("#/dashboard"); } });
    return;
  }
  if(el.hasAttribute("data-short-ok")){
    const ta = document.getElementById("short-answer");
    if(ta) Run.answers[Run.index] = ta.value.trim();
    const quiz = Actions.quiz(Run.quiz);
    if(Run.index < quiz.questions.length-1){ Run.dir="next"; Run.index++; render(); }
    else { render(); UI.toast(t("q.next")); }
    return;
  }

  // results / mistakes
  if(d.noteQ){
    const q = findQuestion(d.noteQ);
    openNoteModal({ preset:{ courseId:d.course||null, qId:d.noteQ, mistakeId:d.mistake||null,
      text:"" } });
    return;
  }
  if(d.retryQ){ retryQuestion(d.retryQ, d.course || null); return; }
  if(d.mfilter){ MisFilter.mode = d.mfilter; render(); return; }
  if(el.hasAttribute("data-practice-mistakes")){ practiceMistakes(); return; }
  if(d.mastered){ Actions.setMistakeMastered(d.mastered, d.val === "1"); render(); return; }
  if(d.removeMistake){ Actions.removeMistake(d.removeMistake); render(); return; }

  // notes
  if(el.hasAttribute("data-note-new")){ openNoteModal({ preset:{ courseId:NoteFilter.courseId } }); return; }
  if(d.noteEdit){ const n = S.notes.find(x=>x.id===d.noteEdit); if(n) openNoteModal({ note:n }); return; }
  if(d.notePin){ const n = S.notes.find(x=>x.id===d.notePin); if(n){ Actions.updateNote(n.id, {pinned:!n.pinned}); render(); } return; }
  if(d.noteDel){
    const n = S.notes.find(x=>x.id===d.noteDel);
    UI.confirm({ title:t("notes.delete"), body:(n?noteText(n).slice(0,120):"") , onConfirm(){ Actions.deleteNote(d.noteDel); render(); } });
    return;
  }

  // settings
  if(d.theme){ S.ui.theme = d.theme; Store.save(S); applyTheme(); render(); return; }
  if(el.hasAttribute("data-export")){ exportData(); return; }
  if(el.hasAttribute("data-reset")){
    UI.confirm({ title:t("set.reset.confirm.t"), body:t("set.reset.confirm.d"), onConfirm(){
      Store.clear(); S = blankState(); setLang("fr"); applyTheme(); go("#/"); render();
    }});
    return;
  }
  if(el.hasAttribute("data-logout")){ S.user = null; Store.save(S); go("#/"); return; }
});

function findQuestion(qId){
  for(const z of S.quizzes){ const q = z.questions.find(x=>x.id===qId); if(q) return q; }
  const m = S.mistakes.find(x=>x.qId===qId);
  return m ? m.snapshot : null;
}
function paintDots(){
  const quiz = Actions.quiz(Run.quiz); if(!quiz) return;
  document.querySelectorAll("[data-goto]").forEach(b => {
    const i = +b.dataset.goto, a = Run.answers[i];
    b.classList.toggle("done", a !== undefined && a !== "");
    b.classList.toggle("cur", i === Run.index);
  });
  const answered = Object.keys(Run.answers).filter(k => Run.answers[k] !== undefined && Run.answers[k] !== "").length;
  const c = document.getElementById("run-count");
  if(c) c.textContent = answered + "/" + quiz.questions.length;
}

/* Mobile: keep the bottom bar out of the way while a field has focus, so the
   on-screen keyboard never covers what the student is writing. */
document.addEventListener("focusin", e => {
  if(e.target && e.target.matches && e.target.matches("input,textarea,select")) document.body.classList.add("typing");
});
document.addEventListener("focusout", e => {
  if(e.target && e.target.matches && e.target.matches("input,textarea,select")) document.body.classList.remove("typing");
});

/* keyboard: quiz navigation + form submit */
document.addEventListener("keydown", e => {
  // Never steal keys from someone who is typing: no arrow-key jumps, no digits
  // swallowed, no accidental submit while writing a free-text answer.
  const el = e.target;
  const typing = !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.isContentEditable);
  if(typing){ if(e.key === "Escape") el.blur(); return; }

  if(Run.quiz && parseHash().parts[0]==="quiz" && parseHash().parts[1]==="run"){
    const quiz = Actions.quiz(Run.quiz); if(!quiz) return;
    const q = quiz.questions[Run.index];
    if(e.key === "ArrowRight"){ Run.dir="next"; Run.index = Math.min(quiz.questions.length-1, Run.index+1); render(); e.preventDefault(); }
    if(e.key === "ArrowLeft"){ Run.dir="prev"; Run.index = Math.max(0, Run.index-1); render(); e.preventDefault(); }
    if(q && q.type !== "short" && /^[1-4]$/.test(e.key)){
      const i = +e.key - 1;
      if(q.options[i]){ Run.answers[Run.index] = i; render(); e.preventDefault(); }
    }
    if(e.key === "Enter" && q && q.type === "short"){
      const ta = document.getElementById("short-answer");
      if(ta && document.activeElement === ta){ Run.answers[Run.index] = ta.value.trim(); render(); e.preventDefault(); }
    }
  }
});

/* forms */
document.addEventListener("submit", e => {
  const form = e.target;
  e.preventDefault();
  if(form.matches("[data-auth]")){
    const fd = new FormData(form);
    const isSignup = !!form.querySelector("#f-name");
    const name = (fd.get("name")||"").toString().trim();
    const email = (fd.get("email")||"").toString().trim();
    const pass = (fd.get("password")||"").toString();
    const err = form.querySelector("[data-auth-err]");
    const fail = msg => { err.textContent = msg; err.classList.remove("hide"); form.querySelector("input").focus(); };
    if(isSignup && !name) return fail(t("auth.err.name"));
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail(t("auth.err.mail"));
    if(pass.length < 6) return fail(t("auth.err.pass"));
    err.classList.add("hide");
    const existing = S.user && S.user.email === email;
    S.user = { ...(existing ? S.user : {}), name: name || (S.user && S.user.name) || email.split("@")[0], email, provider:"email",
               level:(S.user&&S.user.level)||"bac", section:(S.user&&S.user.section)||"Informatique", spec:(S.user&&S.user.spec)||"",
               uiLang:L(), quizLang:(S.user&&S.user.quizLang)||"auto" };
    Store.save(S);
    go(existing ? "#/dashboard" : "#/onboarding");
    return;
  }
  if(form.matches("[data-onb]")){
    const fd = new FormData(form);
    const u = Actions.ensureUser();
    u.name = (fd.get("name")||u.name||"").toString().trim() || u.name || "Étudiant";
    if(form.querySelector("#o-spec")) u.spec = (fd.get("spec")||"").toString().trim();
    u.quizLang = (form.querySelector("#o-quizlang")||{}).value || u.quizLang;
    u.uiLang = L();
    Store.save(S);
    go("#/dashboard");
    return;
  }
  if(form.matches("[data-settings]")){
    const fd = new FormData(form);
    const u = Actions.ensureUser();
    u.name = (fd.get("name")||u.name||"").toString();
    u.email = (fd.get("email")||u.email||"").toString();
    if(fd.get("section")) u.section = fd.get("section").toString();
    if(form.querySelector("#s-spec")) u.spec = (fd.get("spec")||"").toString();
    u.quizLang = (form.querySelector("#s-quizlang")||{}).value || u.quizLang;
    u.uiLang = L();
    Store.save(S); UI.toast(t("set.saved")); return;
  }
});

/* drag & drop */
document.addEventListener("dragover", e => {
  const drop = e.target.closest && e.target.closest("#drop");
  if(drop){ e.preventDefault(); drop.classList.add("hot"); }
});
document.addEventListener("dragleave", e => {
  const drop = e.target.closest && e.target.closest("#drop");
  if(drop) drop.classList.remove("hot");
});
document.addEventListener("drop", e => {
  const drop = e.target.closest && e.target.closest("#drop");
  if(!drop) return;
  e.preventDefault(); drop.classList.remove("hot");
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) selectFile(f);
});
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); const fi = document.getElementById("file-input"); if(fi) fi.click(); }
});

/* boot */
function boot(){
  setLang(S.ui.lang || "fr");
  applyTheme();
  AI.health(); // ask the backend whether real AI is available; never blocks the UI
  if(!S.user && !S.courses.length){
    // first visit: the landing page is the entry point
    if(!location.hash) location.hash = "#/";
  }
  if(window.location.hash === "#/upload" && !S.user){ location.hash = "#/login"; }
  window.addEventListener("hashchange", render);
  render();
}
boot();
</script>
